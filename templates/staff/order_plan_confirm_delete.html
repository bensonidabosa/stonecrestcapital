{% extends "../customer/base.html" %}

{% block title %}
Delete Strategy
{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 mt-5">

            {% include "../notification/messages.html" %}

            <div class="card shadow-sm">
                <div class="card-body">

                    <h4 class="text-center mb-4">
                        Delete Strategy
                    </h4>

                    <p>
                        Are you sure you want to delete this Active Strategy?
                    </p>

                    <form method="post">
                        {% csrf_token %}

                        <a href="{% url 'staff:admin_customer_detail' order_plan.portfolio.user.id %}">
                            Cancel
                        </a>

                        <button type="submit" class="btn btn-danger ms-4">
                            Yes, Delete
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
